[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlc-gait-assembler"
version = "0.1.0"
description = "PySide6 desktop GUI for bulk video region, flip, and enhancement processing."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "PyYAML",
    "PySide6",
    "opencv-python",
    "tables",
]

[project.optional-dependencies]
test = [
    "matplotlib",
    "numpy",
    "pandas",
    "pytest",
    "scikit-learn",
    "scipy",
]

[project.scripts]
dlc-gait-assembler = "dlc_gait_assembly.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
