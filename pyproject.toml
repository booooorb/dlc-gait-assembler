[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlc-gait-assembler"
version = "0.1.0"
description = "PySide6 desktop GUI for bulk video region, flip, and enhancement processing."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "PyYAML",
    "PySide6",
    "opencv-python",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tables",
]

[project.optional-dependencies]
test = [
    "matplotlib",
    "numpy",
    "pandas",
    "pytest",
    "scikit-learn",
    "scipy",
]
dev = [
    "matplotlib",
    "numpy",
    "pandas",
    "pytest",
    "ruff>=0.11",
    "scikit-learn",
    "scipy",
    "statsmodels",
]
analysis = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
]

[project.scripts]
dlc-gait-assembler = "dlc_gait_assembly.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dlc_gait_assembly.gui.theme" = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["imports/alma"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B905", "E402", "F841", "I001"]
"tests/unit/test_knee_correction.py" = ["F401"]
"tests/unit/test_ladder_pipeline.py" = ["F401"]
