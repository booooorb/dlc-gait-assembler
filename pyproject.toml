[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlc-gait-assembler"
version = "0.1.0"
readme = "README.md"
description = "Runway and Ladder gait analysis with video preparation, DeepLabCut integration, and cohort analysis."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "PyYAML",
    "PySide6",
    "opencv-python",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tables",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["build", "pytest", "ruff>=0.11"]
analysis = []

[project.scripts]
dlc-gait-assembler = "dlc_gait_assembly.app.app_bootstrap:main"
dlc-gait-migrate = "dlc_gait_assembly.maintenance.migration_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dlc_gait_assembly.resources" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "**/__pycache__/*", "*.py[cod]", "**/*.py[cod]", ".DS_Store", "**/.DS_Store"]

[tool.pytest.ini_options]
addopts = [
    "-p", "no:napari",
    "-p", "no:napari-plugin-engine",
    "-p", "no:npe2",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["references", "workspace", "imports", "DLC-Gait-Analysis-main"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B905", "E402", "F841", "I001"]
