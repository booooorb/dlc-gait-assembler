# GUI default settings
window_height: 700             # height of the GUI window - adjust to fit your screen resolution
window_width: 1100              # width of the GUI window
# video specs
frame_rate: 120
# ladder rung analysis
likelihood_threshold: 0.1       # threshold of bodypart coordinate estimation likelihood, highlight estimates above threshold for ladder rung user validation
depth_threshold: 0.8            # percentage of recovery relative to depth of previous footfall / slip
threshold: ''                   # for threshold method in ladder rung
# kinematics analysis
lowpass_filter_cutoff: 6        # cutoff frequency for Butterworth filter applied to bodypart coordinate estimation in kinematics analysis
pixels_per_cm: ''               # provide px - cm ratio of the video, if known
cm_speed: ''                    # treadmill speed in cm/s (required for treadmill analysis)
right_to_left: False            # direction of walking: "auto" (detect automatically), True (right-to-left), False (left-to-right)
no_outlier_filter: False        # runway: bypass height/length ranges only; retain tracking/bout checks
dragging_filter: False          # runway: opt-in exclusion of >=95% near-ground movement
kinematics_likelihood_threshold: 0.5 # legacy ALMA threshold; synchronized stroke outputs use 0.95 below
drag_clearance_cm: 0.1          # minimum toe clearance above ground (cm) to not count as dragging
drag_min_consecutive_frames: 4  # minimum consecutive frames of ground contact to count as dragging (reduces noise)
# Additional opt-in updated ALMA runway detector (legacy remains the default).
stride_detection_method: 'ALMA (legacy)'
runway_confidence_threshold: 0.6
runway_max_gap_s: 0.02
runway_min_body_speed: 0.25
runway_min_contact_s: 0.03
runway_joint_interpolation: none
runway_joint_max_gap_s: 0.02
runway_joint_max_interpolated_fraction: 0.10
runway_joint_max_segment_change: 0.35
runway_joint_filter_cutoff: null
runway_stickplot_source: tracked
# Measured spatial calibration; no anatomical length is assumed.
# Optional calibration_method: reference, manual, map, per_view, or treadmill.
# An explicit mode uses only its own settings; reference also applies to treadmill recordings.
calibration_method: reference    # retain the app's reference selection; enter its measured length
auto_calibrate_spatial: False   # choose reference calibration explicitly with a measured length
reference_segment: 'ankle_toe'  # segment requires its measured physical length
reference_length_cm: ''         # enter a measured physical length in cm

# stride filtering thresholds (applied to both treadmill and spontaneous analyses)
step_height_min_cm: 0.0         # include strides with step height >= this (cm)
step_height_max_cm: 2         # include strides with step height <= this (cm)
stride_length_min_cm: 0.0       # include strides with stride length >= this (cm)
stride_length_max_cm: 8.0       # include strides with stride length <= this (cm)

# Native ALMA CSVs; choose ALMA side + rust bottom in the UI to include the
# separate underside R analysis and participant/session ALMA mean + sample SD.
output_format: alma
# Legacy post-ALMA integration (only used by older analysis manifests).
# Write tidy/summary parameter tables and eight ALMA diagnostic figures.
generate_alma_representations: True
# Retained RustLab1 features and adapted figures for legacy analysis settings.
# Retired custom parameters are excluded from all workflow outputs.
generate_rustlab1_parameters: True
# Keep the established hindlimb set, or add 46 upstream forelimb/interlimb
# measures for a 76-feature RustLab1 output.
limb_scope: Hindlimb

# Pilot-first synchronized stroke analysis
stroke_analysis_enabled: True
# Coordinate confidence, interpolation, filtering, and stride windows are
# inherited from the ALMA settings above for RustLab1/stroke outputs.
swing_speed_threshold_cm_s: 10.0
minimum_synchronized_cycles: 5
# Optional per-view calibration. Each view accepts pixels_per_cm or separate
# x_pixels_per_cm/y_pixels_per_cm values. Populated camera settings select per_view
# unless calibration_method is explicit. Unset cameras do not borrow shared scales.
view_calibration: {}
