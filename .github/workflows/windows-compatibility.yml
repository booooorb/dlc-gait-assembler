name: Windows compatibility
on:
  push:
    branches: [codex/windows-qa-2026-11-09]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the packaged application
        run: python -m pip install ".[test]"
      - name: Check launcher, resources, and native window
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $env:DLC_GAIT_WORKSPACE = Join-Path $env:RUNNER_TEMP 'gait-smoke'
          @'
          import sys
          from PySide6.QtCore import QPoint, Qt
          from PySide6.QtTest import QTest
          from PySide6.QtWidgets import QApplication
          from dlc_gait_assembly.app.app_bootstrap import apply_theme_mode, create_main_window
          assert sys.platform == "win32"
          app = QApplication([])
          assert app.platformName() == "windows"
          apply_theme_mode(app, None, "light")
          window = create_main_window()
          window.resize(1100, 640)
          window.show()
          QTest.qWait(100)
          assert window.isVisible()
          for icon in (app.windowIcon(), window.windowIcon()):
              assert not icon.isNull()
              assert not icon.pixmap(32, 32).isNull()
          assert window.workflows.new(name="Windows verification")
          profile_id = window.workflows.active.id
          window.routes._show_automated_profiles()
          QTest.qWait(100)
          automation = window.workflows.automatic
          gait = automation.include_gait_analysis_button
          knee = automation.include_knee_correction_button
          assert gait.isVisible() and knee.isVisible()
          assert gait.geometry().bottom() < knee.geometry().top()
          for switch in (gait, knee):
              assert switch.width() >= switch.sizeHint().width()
              QTest.mouseClick(switch, Qt.MouseButton.LeftButton, pos=QPoint(12, switch.height() // 2))
          profile = window.workflows.use_cases.load(profile_id)
          assert not profile.gait_analysis_enabled and profile.knee_correction_enabled
          apply_theme_mode(app, window, "dark")
          QTest.qWait(100)
          assert window.close()
          '@ | python -
      - name: Test workflow saving, automation, and manual tools
        run: >-
          python -m pytest -vv -o faulthandler_timeout=90 -o pythonpath=
          tests/app/client
          tests/runway/automatic/client
          tests/runway/automatic/profiles/client
          tests/runway/automatic/runs/business
          tests/runway/manual/calibration/client
          tests/runway/manual/knee_correction/client
          tests/runway/manual/deeplabcut/infrastructure
          tests/runway/manual/gait_analysis/client
